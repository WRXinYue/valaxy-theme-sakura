name: Release

on:
  push:
    tags:
      - 'v0.11.*'

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Publish to npm
        run: pnpm ci:publish --tag legacy

      - name: Create Classic Sakura release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "Classic Sakura $GITHUB_REF_NAME" \
            --generate-notes --notes-start-tag v0.10.2 \
            --notes 'Classic Sakura for Valaxy 1.5. Install with `pnpm add valaxy-theme-sakura@legacy`.'
        env:
          GH_TOKEN: ${{ github.token }}
